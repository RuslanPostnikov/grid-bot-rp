services:
  postgres:
    image: postgres:16-alpine
    container_name: grid-bot-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: gridbot
      POSTGRES_PASSWORD: gridbot_dev
      POSTGRES_DB: gridbot
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
